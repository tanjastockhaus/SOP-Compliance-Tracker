<!DOCTYPE html>

<html lang="en">

    <head>
        <!-- standard character coding-->
        <meta charset="utf-8">

        <!-- different display sizes-->
        <meta name="viewport" content="initial-scale=1, width=device-width">

        <!-- import bootstrap-->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

        <!-- connection to css page-->
        <link href="/static/styles.css" rel="stylesheet">

        <!-- titel for different routes-->
        <title>Name: {% block title %}{% endblock %}</title>

    </head>

    <body>

        <!-- navigation bar-->
        <header>
            <nav class="nav nav-pills justify-content-end">
                <a class="nav-link" aria-current="page" href="/">Home</a>
                <a class="nav-link" href="/input">Data entry</a>

                <div class="dropdown">
                    <button class="btn btn-secondary dropdown-toggle" type="button" id="dropdownMenuButton" data-bs-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                        SOP
                    </button>
                    <div class="dropdown-menu" aria-labelledby="dropdownMenuButton">
                        <a class="dropdown-item" href="/stemi">STEMI</a>
                        <a class="dropdown-item" href="/stroke">Stroke</a>
                        <a class="dropdown-item" href="/trauma">Trauma</a>
                    </div>
                </div>
                <a class="nav-link" href="/logout">Logout</a>
            </nav>
        </header>

        <!-- main-->
        <main class="container py-5 text-center"> <!--Bootstrap: Main-area in the middle with middle text-->
            {% block main %}{% endblock %}
        </main>


        <!-- footer/ css-->
        {% block script %} {% endblock %}
    </body>

</html>
